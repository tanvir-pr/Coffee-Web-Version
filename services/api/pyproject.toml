[project]
name = "crema-api"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "asyncpg>=0.30",
  "fastapi>=0.115",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "sqlalchemy[asyncio]>=2.0",
  "structlog>=24.4",
  "tzdata>=2026.6",
  "uvicorn[standard]>=0.32",
  "webauthn>=3.0.1",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:starlette.exceptions.StarletteDeprecationWarning"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
warn_unused_ignores = true
