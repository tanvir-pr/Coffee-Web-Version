services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crema
      POSTGRES_PASSWORD: crema
      POSTGRES_DB: crema
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crema -d crema"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
